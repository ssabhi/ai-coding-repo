server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers live at server level only. nginx drops inherited
  # add_header directives in any location that declares its own, so locations
  # below set caching with `expires` instead of add_header.
  #
  # Product images are hosted by the product source (Fake Store's CDN), so
  # that is the only third-party origin allowed.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://fakestoreapi.com; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fingerprinted build assets never change, so cache them for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Everything else is a client-side route: serve the app shell, never cached.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
